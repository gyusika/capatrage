# 매일 예약 현황을 관측한다.
#
# 왜 매일이어야 하는가: 상품의 절반(10,355개 중 5,324개)이 예약 마감 설정 때문에
# D+2 부터만 달력에 열린다. 그 업체의 D+0/D+1 예약 현황은 이틀 전에 봐두지 않으면
# 영원히 관측 불가다. 하루 거르면 그날 마감된 업체들의 근접일이 통째로 빈다.
#
# 왜 Vercel/Supabase 가 아닌가: 예약 수집이 서울만 해도 약 3시간이다.
# Vercel Function 은 최대 800초, Supabase Edge Function 도 마찬가지라 담을 수 없다.
name: daily

on:
  schedule:
    # 04:00 KST = 19:00 UTC (전날). 상대 서버가 한가한 시간대.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: '관측일 (YYYY-MM-DD). 비우면 실행 시점의 KST 날짜'
        required: false

# 이전 실행이 아직 돌고 있으면 겹치지 않게 한다. 상대 서버에 대한 요청률이
# 두 배가 되는 것을 막는 안전장치다.
concurrency:
  group: daily
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # ── 1단계: 공간 상세 전수 (~80분) ────────────────────────────────
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      run_date: ${{ steps.d.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - name: 관측일 확정
        id: d
        run: |
          D="${{ inputs.run_date }}"
          [ -n "$D" ] || D=$(TZ=Asia/Seoul date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "관측일 $D"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # 스크립트들이 `node --env-file=.env` 로 켜져 있어서 파일로 떨군다.
      - name: .env 생성
        run: |
          printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env

      # 새 마이그레이션이 있어도 사람이 손으로 적용하러 오지 않게 한다.
      # 전부 create ... if not exists / create or replace 라 몇 번 돌려도 같다.
      - name: 스키마 반영
        run: npm run sql -- sql/*.sql

      # 실패 후 재실행할 때 done.txt 로 이어받는다
      - name: 진행분 복원
        uses: actions/cache/restore@v4
        with:
          path: data/snapshots/${{ steps.d.outputs.date }}
          key: snapshots-${{ steps.d.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: snapshots-${{ steps.d.outputs.date }}-

      - name: sitemap 열거
        run: npm run sitemap
        env:
          RUN_DATE: ${{ steps.d.outputs.date }}

      # done.txt 로 이어받으므로 재시도가 처음부터 다시 받지 않는다.
      # 상대 서버가 잠깐 흔들려 죽는 것 때문에 하루치를 통째로 잃지 않게 한다.
      - name: 상세 전수 크롤
        run: |
          for i in 1 2 3; do
            npm run crawl && exit 0
            echo "크롤 ${i}차 실패. 남은 것만 이어서 다시 받는다."
            sleep 60
          done
          exit 1
        env:
          RUN_DATE: ${{ steps.d.outputs.date }}
          CRAWL_RPS: '3'
          CRAWL_CONCURRENCY: '4'

      - name: 진행분 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/snapshots/${{ steps.d.outputs.date }}
          key: snapshots-${{ steps.d.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 공간·상품·태그 적재
        run: npm run load
        env:
          RUN_DATE: ${{ steps.d.outputs.date }}

      # booking 잡이 spaces.jsonl.gz 를 읽어야 한다 (~77MB).
      # sitemap 도 같이 넘긴다 — 이게 있어야 나중에 load 를 다시 돌릴 수 있다.
      - name: 스냅샷 전달
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ steps.d.outputs.date }}
          path: |
            data/snapshots/${{ steps.d.outputs.date }}/spaces.jsonl.gz
            data/sitemap/${{ steps.d.outputs.date }}/spaces.jsonl
            data/sitemap/${{ steps.d.outputs.date }}/reviews.jsonl
          retention-days: 3
          compression-level: 0

  # ── 2단계: 예약 현황 관측 (~4시간, 서울) ─────────────────────────
  # 시간제 10,373개 + 패키지 4,961개 예약타입 × 월 2회 = 약 3만 요청.
  # GitHub 호스티드 러너의 상한이 6시간이라 그 바로 아래로 잡는다.
  booking:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_DATE: ${{ needs.crawl.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: .env 생성
        run: |
          printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env

      # 여러 path 를 올리면 공통 상위 디렉토리(data/) 기준 구조가 보존된다
      - name: 스냅샷 수신
        uses: actions/download-artifact@v4
        with:
          name: snapshots-${{ needs.crawl.outputs.run_date }}
          path: data

      - name: 진행분 복원
        uses: actions/cache/restore@v4
        with:
          path: data/booking/${{ needs.crawl.outputs.run_date }}
          key: booking-${{ needs.crawl.outputs.run_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: booking-${{ needs.crawl.outputs.run_date }}-

      # TARGET_SIDO=11 (서울). booking.js 의 기본값이라 명시만 해둔다.
      - name: 예약 현황 수집
        run: |
          for i in 1 2 3; do
            npm run booking && exit 0
            echo "예약 수집 ${i}차 실패. done.txt 뒤부터 다시 받는다."
            sleep 60
          done
          exit 1
        env:
          TARGET_SIDO: '11'
          BOOK_RPS: '2'
          BOOK_CONCURRENCY: '3'

      - name: 진행분 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/booking/${{ needs.crawl.outputs.run_date }}
          key: booking-${{ needs.crawl.outputs.run_date }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 수집이 중간에 끊겨도 받아둔 만큼은 넣는다. booking_day 는 upsert 라
      # 다음 날 재시도가 같은 행을 덮을 뿐이고, 부분이라도 있는 편이 낫다 —
      # 지나간 날짜의 달력은 API 가 다시 주지 않는다.
      - name: 예약 적재
        if: always()
        run: npm run load:booking

      - name: 수집 결과 요약
        if: always()
        run: |
          {
            echo "## 관측일 ${RUN_DATE}"
            echo
            gunzip -c "data/booking/${RUN_DATE}/slots.jsonl.gz" 2>/dev/null \
              | wc -l | xargs printf '- 일자레코드 %s건\n' || true
            wc -l < "data/booking/${RUN_DATE}/done.txt" 2>/dev/null \
              | xargs printf '- 완료 요청 %s건\n' || true
            wc -l < "data/booking/${RUN_DATE}/errors.log" 2>/dev/null \
              | xargs printf '- 실패 %s건\n' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 로그 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-errors-${{ needs.crawl.outputs.run_date }}
          path: data/booking/${{ needs.crawl.outputs.run_date }}/errors.log
          retention-days: 14
          if-no-files-found: ignore

  # ── 3단계: 집계 ─────────────────────────────────────────────────
  #
  # 왜 잡을 셋으로 쪼갰는가. GitHub 호스티드 러너는 잡 하나에 6시간이 상한이다.
  # 매출 환산은 가장 작은 관측일(39만 행)에서도 50분을 넘겼고, 관측일이 55만 행으로
  # 늘면 더 걸린다. 셋을 한 잡에 넣으면 상한에 걸려 통째로 잘리고, 잘리면 그날
  # 집계가 전부 없어진다 — 실제로 3시간 제한에 걸려 취소된 실행이 세 번 있었다.
  # 나누면 각자 6시간을 따로 받고, 하나가 잘려도 앞 단계 결과는 남는다.
  #
  # 앞 단계가 실패해도 뒤를 건너뛰지 않는다(!cancelled). 뒤 단계가 앞 결과를
  # 정말 필요로 하면 자기가 실패할 것이고, 남은 구멍은 마지막 자가복구가 메운다.

  # 영업시간 판정 + 예약률. 지도·순위표·시간대 화면이 이걸 본다.
  fill:
    needs: [crawl, booking]
    if: ${{ !cancelled() && needs.crawl.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_DATE: ${{ needs.crawl.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: .env 생성
        run: printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env
      - name: 영업시간 판정 + 예약률
        run: npm run compute

  # 매출 환산(D+1~3 × 30.4). 가장 무거운 단계다.
  revenue:
    needs: [crawl, fill]
    if: ${{ !cancelled() && needs.crawl.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_DATE: ${{ needs.crawl.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: .env 생성
        run: printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env
      - name: 매출 집계
        run: npm run revenue

  # 지나간 날짜를 실제로 세서 낸 매출. 곱셈이 없다.
  # 관측이 쌓일수록 실측 일수가 늘고, 30일이 차면 진짜 월매출이 된다.
  settled:
    needs: [crawl, revenue]
    if: ${{ !cancelled() && needs.crawl.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_DATE: ${{ needs.crawl.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: .env 생성
        run: printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env
      - name: 실측 매출
        run: npm run settled

  # ── 4단계: 자가복구 ─────────────────────────────────────────────
  # booking_day 에는 있는데 파생 테이블에 없는 관측일을 찾아 다시 낸다.
  # 오늘이 전부 성공했으면 할 일이 없고, 어제 것이 빠졌으면 오늘 메운다.
  # 이게 없어서 09-06·09-07 관측분이 열흘 넘게 밀려 있었다.
  heal:
    needs: [crawl, fill, revenue, settled]
    if: ${{ always() && needs.crawl.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_DATE: ${{ needs.crawl.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: .env 생성
        run: printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env

      - name: 밀린 집계 자가복구
        run: npm run backfill

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 집계 ${RUN_DATE}"
            echo "- 예약률: ${{ needs.fill.result }}"
            echo "- 매출 환산: ${{ needs.revenue.result }}"
            echo "- 매출 실측: ${{ needs.settled.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
